name: Avistone
description: 'Beijing Avistone Biotechnology Co., Ltd. is a commercial-stage innovative biopharmaceutical
  company headquartered in Beijing, China, focused on the research, development, and commercialization of
  first-in-class and best-in-class oncology therapies. Founded in 2012 (originally Beijing Pearl Biotechnology)
  and renamed Avistone in 2018, the company has two approved cancer drugs on the market: Vebreltinib (万比锐®),
  a MET inhibitor approved for non-small cell lung cancer and glioma indications and included in China''s
  National Reimbursement Drug List, and Andamertinib (安比锐®), an EGFR exon 20 insertion inhibitor approved
  in 2026 for advanced NSCLC. Avistone maintains a pipeline of additional candidates (ANS01 through ANS09)
  across solid-tumor indications and is backed by IDG Capital. The company publishes no public developer
  API or programmatic surface; this profile captures its corporate and investor identity.'
